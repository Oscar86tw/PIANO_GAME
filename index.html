<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7067d9">
  <title>PIANO LEARNING V1.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="homeView" class="view active">
      <header class="home-header">
        <div>
          <div class="brand">PIANO LEARNING</div>
          <h1>今天想練什麼？</h1>
          <p>選一堂課，或直接開始彈一首歌。</p>
        </div>
        <div class="version-badge">VERSION V1.1</div>
      </header>

      <nav class="home-tabs" aria-label="主要功能">
        <button class="tab active" data-tab="courses">課程</button>
        <button class="tab" data-tab="songs">歌曲</button>
        <button class="tab" data-tab="quick">5 分鐘練習</button>
        <button class="tab" data-tab="progress">進度</button>
      </nav>

      <section id="coursesPanel" class="tab-panel active">
        <div class="section-title">
          <div><small>LEARN</small><h2>循序課程</h2></div>
          <span>6 個主題</span>
        </div>
        <div class="course-grid">
          <button class="course-card" data-song="twinkle">
            <span class="course-icon">♪</span><b>認識音符</b><small>C–G 五個音</small><em>第 1 課</em>
          </button>
          <button class="course-card" data-song="ode">
            <span class="course-icon">♩</span><b>節奏基礎</b><small>四分音符與拍點</small><em>第 2 課</em>
          </button>
          <button class="course-card" data-song="mary">
            <span class="course-icon">✋</span><b>右手練習</b><small>1–5 指固定手位</small><em>第 3 課</em>
          </button>
          <button class="course-card" data-song="scale">
            <span class="course-icon">↙</span><b>左手練習</b><small>低音區基礎</small><em>第 4 課</em>
          </button>
          <button class="course-card" data-song="canon">
            <span class="course-icon">♫</span><b>雙手合奏</b><small>左右手配合</small><em>第 5 課</em>
          </button>
          <button class="course-card" data-song="sight">
            <span class="course-icon">𝄞</span><b>視譜練習</b><small>看譜直接彈</small><em>第 6 課</em>
          </button>
        </div>
      </section>

      <section id="songsPanel" class="tab-panel">
        <div class="section-title">
          <div><small>PLAY</small><h2>歌曲庫</h2></div>
          <span>可持續增加</span>
        </div>
        <div class="filter-row">
          <button class="filter active" data-level="all">全部</button>
          <button class="filter" data-level="beginner">Beginner</button>
          <button class="filter" data-level="easy">Easy</button>
          <button class="filter" data-level="normal">Normal</button>
        </div>
        <div id="songList" class="song-list"></div>
      </section>

      <section id="quickPanel" class="tab-panel">
        <div class="quick-card">
          <div class="quick-orb">5</div>
          <div>
            <small>DAILY PRACTICE</small>
            <h2>5 分鐘快速練習</h2>
            <p>音符、節奏、視譜各一小段，不用挑歌。</p>
            <button id="quickStart" class="primary">開始練習</button>
          </div>
        </div>
      </section>

      <section id="progressPanel" class="tab-panel">
        <div class="progress-cards">
          <div><small>本週練習</small><b>3 天</b></div>
          <div><small>完成歌曲</small><b>4</b></div>
          <div><small>平均正確率</small><b>88%</b></div>
        </div>
      </section>
    </section>

    <section id="practiceView" class="view practice-view">
      <header class="practice-top">
        <button id="backBtn" class="icon-btn" aria-label="返回">←</button>
        <div class="practice-title">
          <small id="practiceModeLabel">PLAY</small>
          <strong id="practiceTitle">Twinkle Twinkle Little Star</strong>
        </div>
        <button id="pauseBtn" class="pause-btn" aria-label="暫停"><span></span><span></span></button>
      </header>

      <div class="top-progress"><div id="topProgressBar"></div></div>

      <section class="practice-stage" id="practiceStage">
        <div class="staff-shell">
          <div class="clef">𝄞</div>
          <div class="staff-window" id="staffWindow">
            <div class="staff-lines">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="fixed-playhead" aria-hidden="true"></div>
            <div id="scrollingScore" class="scrolling-score"></div>
            <div id="feedbackTint" class="feedback-tint" aria-hidden="true"></div>
            <div id="rhythmAssist" class="rhythm-assist" hidden>
              <span></span><span></span><span></span><span></span>
              <b id="assistBpm">90 BPM</b>
            </div>
          </div>
        </div>

        <div class="practice-footer">
          <div class="compact-controls">
            <label>練習速度
              <select id="speedSelect">
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
              </select>
            </label>
            <label>手部
              <select id="handSelect">
                <option value="right">右手</option>
                <option value="left">左手</option>
                <option value="both">雙手</option>
              </select>
            </label>
            <label>模式
              <select id="practiceMode">
                <option value="play">演奏</option>
                <option value="learn">學習</option>
              </select>
            </label>
            <label>節拍器 BPM
              <div class="tempo-control">
                <button id="tempoMinus" type="button" aria-label="降低 BPM">−</button>
                <input id="tempoInput" type="number" min="30" max="240" step="1" value="84" inputmode="numeric">
                <button id="tempoPlus" type="button" aria-label="提高 BPM">＋</button>
              </div>
              <small class="tempo-note">預設跟隨樂譜速度</small>
            </label>
          </div>

          <div class="audio-row">
            <button id="micBtn" class="soft-btn">啟動麥克風</button>
            <button id="metroBtn" class="soft-btn">節拍器：關</button>
            <button id="tempoReset" class="soft-btn">恢復譜面 BPM</button>
            <div class="heard">
              <small>目前聽到</small>
              <b id="heardNote">—</b>
            </div>
          </div>

          <div class="match-status">
            <div><small>譜面音符</small><b id="scoreNote">—</b></div>
            <div><small>實際彈奏</small><b id="playedNote">—</b></div>
            <div><small>節拍誤差</small><b id="timingDelta">—</b></div>
            <div><small>已記錄</small><b id="recordCount">0</b></div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
